name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run test suite
        run: pytest tests/ -v

      - name: Check model file size
        run: |
          if [ -f models/efficientnet_plantvillage.h5 ]; then
            SIZE_MB=$(du -m models/efficientnet_plantvillage.h5 | cut -f1)
            echo "Model size: ${SIZE_MB} MB"
            if [ "$SIZE_MB" -gt 500 ]; then
              echo "::warning::Model file exceeds 500MB — consider Git LFS or Hugging Face Hub storage."
            fi
          else
            echo "No trained model file present yet — skipping size check."
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agrisense-ai-api:ci .
